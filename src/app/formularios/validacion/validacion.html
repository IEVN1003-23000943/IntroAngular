<div class="col-6">
  <div class="form-group pt-4">
    <label for="frace"><h1>Ingresa Usuario y Contraseña</h1></label><br>
    <input type="text" name="usuario" id="usuario" [(ngModel)]="usuario" placeholder="Usuario..." class="form-control"><br>
    <input type="password" name="contrasena" id="contrasena" [(ngModel)]="contrasena" placeholder="Contraseña..." class="form-control"><br>
    <button type="button" class="btn btn-primary" (click)="ingresar()">Iniciar</button>
  </div>
  <div class="mt-3">
    <h3>{{respuesta}}</h3>
  </div>
</div>
